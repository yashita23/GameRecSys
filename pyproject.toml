# Chỉ khai báo package để `pip install -e .` import được `gamerecsys`.
# Phiên bản thư viện nằm trong requirements.txt (xem docs/environment.md).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gamerecsys"
version = "0.1.0"
description = "Hệ gợi ý game Steam (IT4613)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: test chạy lâu hơn vài giây (ví dụ huấn luyện RecBole)"]
